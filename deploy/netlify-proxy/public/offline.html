<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Dispatch — Connecting</title>
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        background: #070a0f;
        color: #f8fafc;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        padding: 24px;
        box-sizing: border-box;
      }
      main {
        width: 100%;
        max-width: 420px;
        text-align: center;
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 16px;
        padding: 32px 24px;
        box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.5);
      }
      .status-pill {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 4px 12px;
        border-radius: 9999px;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.1);
        font-size: 12px;
        font-weight: 500;
        color: #94a3b8;
        margin-bottom: 20px;
      }
      .status-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #38bdf8;
        box-shadow: 0 0 8px #38bdf8;
        animation: pulse 1.8s infinite;
      }
      @keyframes pulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.4; transform: scale(0.85); }
      }
      h1 {
        margin: 0 0 10px;
        font-size: 19px;
        font-weight: 600;
        letter-spacing: -0.02em;
        color: #f8fafc;
      }
      p {
        margin: 0 0 24px;
        font-size: 14px;
        line-height: 1.5;
        color: #94a3b8;
      }
      .actions {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      button {
        appearance: none;
        border: 0;
        background: #f8fafc;
        color: #070a0f;
        font-weight: 600;
        font-size: 14px;
        padding: 11px 20px;
        border-radius: 10px;
        cursor: pointer;
        transition: transform 0.1s ease, background 0.15s ease;
      }
      button:active {
        transform: scale(0.98);
      }
      .countdown-text {
        font-size: 12px;
        color: #64748b;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="status-pill">
        <span class="status-dot"></span>
        <span>Reconnecting to engine</span>
      </div>
      <h1>Dispatch Engine Connecting</h1>
      <p>The host video engine is establishing a secure tunnel. If your host just woke up, your connection will resume automatically.</p>
      <div class="actions">
        <button id="retry-btn" onclick="location.reload()">Retry Now</button>
        <p class="countdown-text">Auto-retrying in <span id="countdown">4</span>s...</p>
      </div>
    </main>
    <script>
      let seconds = 4;
      const countEl = document.getElementById("countdown");
      const timer = setInterval(() => {
        seconds--;
        if (countEl) countEl.textContent = seconds;
        if (seconds <= 0) {
          clearInterval(timer);
          location.reload();
        }
      }, 1000);
    </script>
  </body>
</html>

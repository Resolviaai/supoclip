<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Dispatch — Offline</title>
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        background: #070a0f;
        color: #f8fafc;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        padding: 24px;
      }
      main {
        max-width: 400px;
        text-align: center;
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 16px;
        padding: 28px 24px;
      }
      h1 { margin: 0 0 8px; font-size: 18px; font-weight: 600; }
      p { margin: 0 0 20px; font-size: 14px; line-height: 1.5; color: #94a3b8; }
      button {
        appearance: none;
        border: 0;
        background: #f8fafc;
        color: #070a0f;
        font-weight: 600;
        font-size: 14px;
        padding: 10px 18px;
        border-radius: 10px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Dispatch is waking up</h1>
      <p>The local video engine is currently offline. Start Docker and the tunnel on your host machine, then tap retry.</p>
      <button onclick="location.reload()">Retry</button>
    </main>
  </body>
</html>
